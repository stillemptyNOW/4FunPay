[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Короткие трейсбеки и явный список результатов: удобнее читать в SSH-сессии.
addopts = -v --tb=short --strict-markers

# Проект местами использует устаревшие конструкции из зависимостей.
# Свои предупреждения при этом видеть нужно, поэтому глушим только чужие.
filterwarnings =
    default
    ignore::DeprecationWarning:telebot.*
    ignore::DeprecationWarning:urllib3.*
